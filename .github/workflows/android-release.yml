name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore keystore and google services
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/src/release

          # Keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/src/release/unloop_release.jks

          # google-services
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/src/release/google-services.json

          # keystore.properties
          {
            printf 'storeFile=%s\n' 'src/release/unloop_release.jks'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Determine Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Strip 'v' from tag
          VERSION_NAME=${GITHUB_REF_NAME#v}
          VERSION_CODE=${GITHUB_RUN_NUMBER}

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Create local.properties
        run: echo "" > local.properties

      - name: Build Release
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Prepare Release Notes
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          CHANGELOG_PATH="app/src/main/assets/CHANGELOG.md"

          echo "# Version $VERSION_NAME" > release_notes.md
          echo "" >> release_notes.md
          echo "Released: $RELEASE_DATE" >> release_notes.md
          echo "" >> release_notes.md

          if [ -f "$CHANGELOG_PATH" ]; then
            cat "$CHANGELOG_PATH" >> release_notes.md
          else
            echo "No changelog found." >> release_notes.md
          fi

          mkdir -p whatsnew
          if [ -f "$CHANGELOG_PATH" ]; then
            # Remove '## ' headers for Google Play release notes (plain text)
            sed 's/^## //' "$CHANGELOG_PATH" | head -c 500 > whatsnew/whatsnew-en-US
          else
            echo "Released on $RELEASE_DATE" > whatsnew/whatsnew-en-US
          fi

      - name: Upload To Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.charan.unloop
          releaseFile: app/build/outputs/bundle/release/*.aab
          track: alpha
          inAppUpdatePriority: 5
          whatsNewDirectory: whatsnew

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: false
          body_path: release_notes.md
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
