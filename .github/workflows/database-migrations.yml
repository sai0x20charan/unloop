name: Room Migration Tests

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-tests:
    name: Room migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        api-level: [29]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free runner disk space for the emulator
        run: |
          df -h /
          # This Android-only job does not use these preinstalled toolchains.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup
          df -h /

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore debug Firebase config
        env:
          GOOGLE_SERVICES_JSON_DEBUG_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_DEBUG_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_DEBUG_BASE64 is unavailable for this run."
            exit 1
          fi
          mkdir -p app/src/debug
          printf '%s' "$GOOGLE_SERVICES_JSON_DEBUG_BASE64" | base64 --decode > app/src/debug/google-services.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run database migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          # Request a small partition; the system image can still require more space.
          disk-size: 2048M
          disable-animations: true
          # This task builds and installs the APKs after the emulator has booted.
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.charan.unloop.DBMigrationTests --stacktrace
