name: Android CI

on:
  pull_request:
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint and debug/release builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore shared dummy Firebase config
        env:
          GOOGLE_SERVICES_JSON_DEBUG_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_DEBUG_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_DEBUG_BASE64 is unavailable for this run."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_DEBUG_BASE64" | base64 --decode > app/google-services.json

      - name: Lint and assemble debug and unsigned release APKs
        # Build checks use dummy Firebase settings and must not upload release mappings.
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease -x :app:uploadCrashlyticsMappingFileRelease --stacktrace
